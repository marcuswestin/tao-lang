name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          github.event_name == 'pull_request_target' ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/marcuswestin/tao-lang/blob/main/CLA.md"
          path-to-signatures: "signatures/v1/cla.json"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],github-actions[bot],renovate[bot]"
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: "Thank you for contributing to Tao. Before this pull request can be merged, each contributor must read and sign the Contributor License Agreement: $pathToCLADocument"
          custom-allsigned-prcomment: "All contributors have signed the CLA."
          suggest-recheck: true
